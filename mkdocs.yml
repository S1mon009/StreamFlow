site_name: StreamFlow
site_description: Documentation for StreamFlow
site_url: https://s1mon009.github.io/StreamFlow/

repo_name: S1mon009/StreamFlow
repo_url: https://github.com/S1mon009/StreamFlow

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      media: "(prefers-color-scheme: light)"
    - scheme: slate 
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      media: "(prefers-color-scheme: dark)"
  features:
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.tabs.link
  language: en

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - First download: getting-started/first-download.md
  - Guide:
    - Download modes: guide/download-modes.md
    - Quality and formats: guide/quality-and-formats.md
    - Sources: guide/sources.md
    - Network: guide/network.md
    - Cookies: guide/cookies.md
  - Architecture:
    - Overview: architecture/overview.md
    - Project structure: architecture/project-structure.md
    - Download flow: architecture/download-flow.md
  - API:
    - Home: api/index.md
    - Video downloader: api/video-downloader.md
    - Configuration: api/configuration.md
    - Decorators: api/decorators.md
    - Utilities: api/utilities.md
    - Main: api/main.md
  - Development:
    - Local development: development/local-development.md
    - Contribution: development/contribution.md
  - Reference:
    - FAQ: reference/faq.md
    - Troubleshooting: reference/troubleshooting.md
    - Legal: reference/legal.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_toc_entry: true
            show_root_heading: true
            heading_level: 2
            filters:
              - "!^_"
  - autorefs

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight